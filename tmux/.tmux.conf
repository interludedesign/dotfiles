set-option -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -s escape-time 0

# Press y to copy highlighted text
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Quickly kill the entire session you're working in
bind X kill-session

# Use mouse to scroll
set -g mouse on

# Give each pane a name: a custom title if one is set (tmux defaults the
# title to the hostname), otherwise the pane's current path.
# allow-set-title off stops applications (e.g. Claude Code) overwriting
# titles set via select-pane -T
set -g allow-set-title off
# Name windows after the active pane's custom title when one is set
# (fixes claude showing as its version number, e.g. "2.1.220")
set -g automatic-rename-format "#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}"
set -g pane-border-status bottom
set -g pane-border-format "#{?#{==:#{pane_title},#{host}},#{pane_current_path},#{pane_title}}"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Default new shell to user's login shell
set-option -g default-shell "$SHELL"

# Remove any waiting after hitting ESC so it doesn't interfere with Normal mode in vim
set -s escape-time 0

# For new panes
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# For new windows
bind c new-window -c "#{pane_current_path}"

# Show every session in the status bar (numbered to match the Ctrl+Shift
# bindings below), highlighting the current one, with Claude Code agent
# status per session: [working], [blocked], [done]
# Transparent bar background so it matches the terminal
set -g status-style bg=default,fg=colour250
set -g status-interval 2

# Pad the status bar with a blank row above: move the default content row
# down in a 2-row status area (guard keeps it intact when this file is
# re-sourced)
set -g status 2
run-shell 'f="$(tmux show -gv "status-format[0]")"; if [ -n "$f" ]; then tmux set -g "status-format[1]" "$f"; fi; tmux set -g "status-format[0]" ""'

# Padded window list entries, current window brightened to match the session bar
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg=colour255,bg=colour237,bold
set -g window-status-separator ""
set -g status-left-length 120
set -g status-left "#($HOME/.local/bin/dot-tmux-session-bar '#S') #[fg=colour240]┃#[default] "

# Switch to the first 4 sessions with Ctrl+Shift+j/k/l/; (no prefix required).
# Ghostty translates these into the escape sequences below (see ghostty config).
set -s user-keys[0] "\e[5;30001~"
set -s user-keys[1] "\e[5;30002~"
set -s user-keys[2] "\e[5;30003~"
set -s user-keys[3] "\e[5;30004~"
# Sessions are ordered by creation time to match the session bar numbering
bind -n User0 run-shell 's="$(tmux list-sessions -F "##{session_created} ##S" | sort -n | cut -d" " -f2- | sed -n 1p)"; [ -n "$s" ] && tmux switch-client -t "$s" || true'
bind -n User1 run-shell 's="$(tmux list-sessions -F "##{session_created} ##S" | sort -n | cut -d" " -f2- | sed -n 2p)"; [ -n "$s" ] && tmux switch-client -t "$s" || true'
bind -n User2 run-shell 's="$(tmux list-sessions -F "##{session_created} ##S" | sort -n | cut -d" " -f2- | sed -n 3p)"; [ -n "$s" ] && tmux switch-client -t "$s" || true'
bind -n User3 run-shell 's="$(tmux list-sessions -F "##{session_created} ##S" | sort -n | cut -d" " -f2- | sed -n 4p)"; [ -n "$s" ] && tmux switch-client -t "$s" || true'
